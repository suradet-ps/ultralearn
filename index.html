<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Ultralearn</title>

    <link data-trunk rel="icon" type="image/svg+xml" href="public/favicon.svg" />

    <!-- Manifest and service worker keep stable (unhashed) URLs via copy-file,
         so /manifest.webmanifest and /sw.js stay valid across deploys, while
         the app assets below are content-hashed by Trunk (filehash = true). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="public/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="public/sw.js" />

    <!-- App styles: Trunk copies + hashes these into dist/ -->
    <link data-trunk rel="css" href="public/styles/main.css" />
    <link data-trunk rel="css" href="public/styles/components.css" />

    <!-- WASM entry point. data-wasm-opt="0" avoids Windows/Rust wasm-opt breakage -->
    <link data-trunk rel="rust" data-weak-refs data-wasm-opt="0" />
  </head>
  <body></body>
</html>
